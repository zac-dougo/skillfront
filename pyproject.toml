[project]
name = "skillfront"
version = "0.1.0"
description = "Data and benchmarks for weather prediction models"
requires-python = ">=3.12"
dependencies = [
    "fsspec[http]>=2025.3",
    "numpy>=2.0",
    "scipy>=1.15",
    "xarray>=2025.6",
    "zarr>=3.1,<4",
]

[project.scripts]
skillfront = "skillfront.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
