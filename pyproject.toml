[project]
name = "skillfront"
version = "0.1.0"
description = "Data and benchmarks for weather prediction models"
requires-python = ">=3.12"
dependencies = [
    "fsspec[http]>=2025.3",
    "numpy>=2.0",
    "scipy>=1.15",
    "xarray>=2025.6",
    "zarr>=3.1,<4",
]

[project.scripts]
skillfront = "skillfront.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
